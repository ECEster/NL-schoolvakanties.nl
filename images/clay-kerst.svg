<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="disc" cx="38%" cy="32%" r="68%">
      <stop offset="0%"  stop-color="#EAF5FF"/>
      <stop offset="55%" stop-color="#A8CBE8"/>
      <stop offset="100%" stop-color="#5A8FC0"/>
    </radialGradient>
    <radialGradient id="flake" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0E8F8"/>
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="rgba(40,70,130,0.30)"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- Clay disc -->
    <circle cx="60" cy="60" r="46" fill="url(#disc)"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(60,100,170,0.18)" stroke-width="2.5"/>
    <!-- Snowflake — 6 arms -->
    <g stroke="url(#flake)" stroke-linecap="round" fill="none">
      <!-- Main 6 arms -->
      <line x1="60" y1="20" x2="60" y2="100" stroke="rgba(255,255,255,0.90)" stroke-width="4"/>
      <line x1="60" y1="20" x2="60" y2="100" stroke="rgba(255,255,255,0.90)" stroke-width="4" transform="rotate(60 60 60)"/>
      <line x1="60" y1="20" x2="60" y2="100" stroke="rgba(255,255,255,0.90)" stroke-width="4" transform="rotate(120 60 60)"/>
      <!-- Arm details (V shapes) -->
      <line x1="60" y1="38" x2="50" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
      <line x1="60" y1="38" x2="70" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
      <line x1="60" y1="38" x2="50" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(60 60 60)"/>
      <line x1="60" y1="38" x2="70" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(60 60 60)"/>
      <line x1="60" y1="38" x2="50" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(120 60 60)"/>
      <line x1="60" y1="38" x2="70" y2="28" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(120 60 60)"/>
      <!-- Lower arm details -->
      <line x1="60" y1="82" x2="50" y2="92" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
      <line x1="60" y1="82" x2="70" y2="92" stroke="rgba(255,255,255,0.75)" stroke-width="2.5"/>
      <line x1="60" y1="82" x2="50" y2="92" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(60 60 60)"/>
      <line x1="60" y1="82" x2="70" y2="92" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(60 60 60)"/>
      <line x1="60" y1="82" x2="50" y2="92" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(120 60 60)"/>
      <line x1="60" y1="82" x2="70" y2="92" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" transform="rotate(120 60 60)"/>
    </g>
    <!-- Center circle -->
    <circle cx="60" cy="60" r="7" fill="rgba(255,255,255,0.85)"/>
  </g>
  <!-- Gloss -->
  <ellipse cx="40" cy="38" rx="13" ry="8" fill="rgba(255,255,255,0.52)"
           transform="rotate(-30 40 38)"/>
</svg>
