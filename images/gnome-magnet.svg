<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 190">
  <defs>
    <filter id="gm-shadow" x="-20%" y="-10%" width="160%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="rgba(26,42,28,0.40)"/>
    </filter>
    <radialGradient id="gm-hat" cx="38%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#3D9050"/>
      <stop offset="100%" stop-color="#1A5C2A"/>
    </radialGradient>
    <radialGradient id="gm-face" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#FADDAC"/>
      <stop offset="100%" stop-color="#E8B070"/>
    </radialGradient>
    <radialGradient id="gm-beard" cx="50%" cy="25%" r="72%">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="100%" stop-color="#D8D0BC"/>
    </radialGradient>
    <radialGradient id="gm-body" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#D4B0DC"/>
      <stop offset="100%" stop-color="#A878B8"/>
    </radialGradient>
  </defs>

  <!-- Alles in één groep zodat de schaduw de silhouet volgt -->
  <g filter="url(#gm-shadow)">

    <!-- ── Silhouet-achtergrond: overlappende vormen in crèmekleur ── -->
    <!-- Hoed -->
    <path d="M70,14 L26,90 Q70,84 114,90 Z" fill="#FDFAF4"/>
    <!-- Hoedbrim -->
    <ellipse cx="70" cy="89" rx="46" ry="12" fill="#FDFAF4"/>
    <!-- Hoofd + oren -->
    <ellipse cx="70" cy="103" rx="32" ry="24" fill="#FDFAF4"/>
    <!-- Baard -->
    <ellipse cx="70" cy="138" rx="40" ry="34" fill="#FDFAF4"/>
    <!-- Lijf -->
    <rect x="40" y="158" width="60" height="22" rx="11" fill="#FDFAF4"/>
    <!-- Laarzen -->
    <ellipse cx="56" cy="180" rx="18" ry="9" fill="#FDFAF4"/>
    <ellipse cx="84" cy="180" rx="18" ry="9" fill="#FDFAF4"/>

    <!-- ── Gekleurde gnome-details ── -->

    <!-- Hoed -->
    <path d="M70,14 L26,90 Q70,84 114,90 Z" fill="url(#gm-hat)"/>
    <!-- Hoed highlight -->
    <path d="M70,14 L58,56 L64,54 Z" fill="rgba(255,255,255,0.18)"/>
    <!-- Hoedbrim -->
    <ellipse cx="70" cy="89" rx="46" ry="12" fill="#1A5C2A"/>
    <ellipse cx="70" cy="87" rx="46" ry="12" fill="#2B7A3C"/>
    <ellipse cx="60" cy="85" rx="20" ry="4.5" fill="rgba(255,255,255,0.14)"/>

    <!-- Oren -->
    <ellipse cx="49" cy="101" rx="9" ry="10" fill="url(#gm-face)"/>
    <ellipse cx="91" cy="101" rx="9" ry="10" fill="url(#gm-face)"/>

    <!-- Gezicht -->
    <ellipse cx="70" cy="102" rx="26" ry="22" fill="url(#gm-face)"/>

    <!-- Neus -->
    <ellipse cx="70" cy="108" rx="11" ry="10" fill="#DDA060"/>
    <ellipse cx="67" cy="104" rx="4.5" ry="3" fill="rgba(255,255,255,0.24)"/>

    <!-- Wangen -->
    <ellipse cx="53" cy="110" rx="9" ry="6" fill="#E07060" opacity="0.30"/>
    <ellipse cx="87" cy="110" rx="9" ry="6" fill="#E07060" opacity="0.30"/>

    <!-- Ogen -->
    <circle cx="61" cy="97" r="3.2" fill="#1A2A1C"/>
    <circle cx="79" cy="97" r="3.2" fill="#1A2A1C"/>
    <circle cx="62" cy="96" r="1.3" fill="rgba(255,255,255,0.65)"/>
    <circle cx="80" cy="96" r="1.3" fill="rgba(255,255,255,0.65)"/>

    <!-- Baard -->
    <ellipse cx="70" cy="138" rx="40" ry="34" fill="url(#gm-beard)"/>
    <path d="M48,118 Q70,130 92,118" stroke="rgba(180,168,148,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M44,129 Q70,142 96,129" stroke="rgba(180,168,148,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M46,140 Q70,154 94,140" stroke="rgba(180,168,148,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M50,151 Q70,163 90,151" stroke="rgba(180,168,148,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Armpjes -->
    <ellipse cx="40" cy="156" rx="11" ry="6" fill="#A878B8" transform="rotate(-28 40 156)"/>
    <ellipse cx="100" cy="156" rx="11" ry="6" fill="#A878B8" transform="rotate(28 100 156)"/>

    <!-- Lijf -->
    <rect x="44" y="162" width="52" height="18" rx="9" fill="url(#gm-body)"/>
    <rect x="44" y="162" width="52" height="7" rx="9" fill="rgba(255,255,255,0.18)"/>

    <!-- Laarzen -->
    <ellipse cx="56" cy="180" rx="16" ry="8" fill="#1A2A1C"/>
    <ellipse cx="84" cy="180" rx="16" ry="8" fill="#1A2A1C"/>
    <ellipse cx="53" cy="177" rx="7" ry="3" fill="rgba(255,255,255,0.14)"/>
    <ellipse cx="81" cy="177" rx="7" ry="3" fill="rgba(255,255,255,0.14)"/>

  </g>
</svg>
