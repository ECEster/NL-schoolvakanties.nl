<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 185">
  <defs>
    <filter id="gm-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="rgba(26,42,28,0.28)"/>
    </filter>
    <radialGradient id="gm-bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="100%" stop-color="#E8E0CC"/>
    </radialGradient>
    <radialGradient id="gm-hat" cx="38%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#3D9050"/>
      <stop offset="100%" stop-color="#1A5C2A"/>
    </radialGradient>
    <radialGradient id="gm-face" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#FADDAC"/>
      <stop offset="100%" stop-color="#E8B070"/>
    </radialGradient>
    <radialGradient id="gm-beard" cx="50%" cy="25%" r="72%">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="100%" stop-color="#D8D0BC"/>
    </radialGradient>
    <radialGradient id="gm-body" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#D4B0DC"/>
      <stop offset="100%" stop-color="#A878B8"/>
    </radialGradient>
  </defs>

  <!-- Magneet-achtergrond met plastic rand -->
  <rect x="5" y="5" width="130" height="175" rx="20" fill="url(#gm-bg)" filter="url(#gm-shadow)"/>
  <rect x="5" y="5" width="130" height="175" rx="20" fill="none" stroke="#C4D4C4" stroke-width="2.5"/>
  <!-- Binnenste highlight voor plastic glans -->
  <rect x="10" y="10" width="120" height="80" rx="16" fill="rgba(255,255,255,0.22)"/>

  <!-- Puntige hoed -->
  <path d="M70,16 L30,88 Q70,83 110,88 Z" fill="url(#gm-hat)"/>
  <!-- Hoed highlight -->
  <path d="M70,16 L57,58 L63,56 Z" fill="rgba(255,255,255,0.18)"/>
  <!-- Hoed rand -->
  <ellipse cx="70" cy="87" rx="42" ry="10" fill="#1A5C2A"/>
  <ellipse cx="70" cy="85" rx="42" ry="10" fill="#2B7A3C"/>
  <!-- Hoed rand glans -->
  <ellipse cx="60" cy="83" rx="18" ry="4" fill="rgba(255,255,255,0.15)"/>

  <!-- Oren -->
  <ellipse cx="50" cy="99" rx="8" ry="9" fill="url(#gm-face)"/>
  <ellipse cx="90" cy="99" rx="8" ry="9" fill="url(#gm-face)"/>

  <!-- Gezicht -->
  <ellipse cx="70" cy="100" rx="24" ry="20" fill="url(#gm-face)"/>

  <!-- Neus (groot en rond) -->
  <ellipse cx="70" cy="105" rx="10" ry="9" fill="#DDA060"/>
  <ellipse cx="67" cy="102" rx="4" ry="3" fill="rgba(255,255,255,0.22)"/>

  <!-- Wangen -->
  <ellipse cx="54" cy="107" rx="8" ry="5.5" fill="#E07060" opacity="0.32"/>
  <ellipse cx="86" cy="107" rx="8" ry="5.5" fill="#E07060" opacity="0.32"/>

  <!-- Oogjes -->
  <circle cx="62" cy="96" r="3" fill="#1A2A1C"/>
  <circle cx="78" cy="96" r="3" fill="#1A2A1C"/>
  <circle cx="63" cy="95" r="1.2" fill="rgba(255,255,255,0.65)"/>
  <circle cx="79" cy="95" r="1.2" fill="rgba(255,255,255,0.65)"/>

  <!-- Baard (groot en pluizig) -->
  <ellipse cx="70" cy="134" rx="36" ry="30" fill="url(#gm-beard)"/>
  <!-- Baard textuur -->
  <path d="M50,116 Q70,126 90,116" stroke="rgba(180,168,148,0.45)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M46,126 Q70,137 94,126" stroke="rgba(180,168,148,0.45)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M48,136 Q70,148 92,136" stroke="rgba(180,168,148,0.45)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M52,146 Q70,156 88,146" stroke="rgba(180,168,148,0.45)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Armpjes -->
  <ellipse cx="42" cy="152" rx="10" ry="6" fill="#A878B8" transform="rotate(-25 42 152)"/>
  <ellipse cx="98" cy="152" rx="10" ry="6" fill="#A878B8" transform="rotate(25 98 152)"/>

  <!-- Lijf -->
  <rect x="45" y="158" width="50" height="16" rx="9" fill="url(#gm-body)"/>
  <rect x="45" y="158" width="50" height="7" rx="9" fill="rgba(255,255,255,0.18)"/>

  <!-- Laarsjes -->
  <ellipse cx="58" cy="176" rx="14" ry="7" fill="#1A2A1C"/>
  <ellipse cx="82" cy="176" rx="14" ry="7" fill="#1A2A1C"/>
  <ellipse cx="55" cy="173" rx="6" ry="3" fill="rgba(255,255,255,0.14)"/>
  <ellipse cx="79" cy="173" rx="6" ry="3" fill="rgba(255,255,255,0.14)"/>
</svg>
